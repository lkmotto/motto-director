[project]
name = "motto-director"
version = "0.1.0"
description = "Self-aware autonomous orchestrator for the motto stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    # Fleet coordination + core OTel (added by claude/agent-observability-setup-RLNZR).
    # Instrumentation packages are opt-in via the 'observability' extra below —
    # they're all currently published as 0.XYbN betas which uv won't pick up
    # in a stable resolver. observability._try_instrument() no-ops gracefully
    # when they're missing.
    "fastmcp>=2.10",
    "psycopg[binary]>=3.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]
# Opt-in extra: install with `pip install '.[observability]' --pre` (or set
# `--prerelease=allow` for uv) to get richer per-library OTel spans. Without
# this extra, observability still works — you get HTTP-level traces from
# httpx (which Anthropic's SDK uses internally) but not LLM-aware fields
# like prompts/completions on the Anthropic span.
observability = [
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-anthropic",
]

[project.scripts]
motto-director = "director.main:run"
motto-director-digest = "director.digest:run_digest"
motto-director-meta = "director.meta:run_meta"
motto-director-quality = "director.quality_cron:run_quality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["director"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
