name: sync-deepseek-secret-to-northflank

# One-shot workflow to push secrets.DEEPSEEK_API (set as a GitHub repo secret)
# into the Northflank motto-core-prd secret group as DEEPSEEK_API_KEY. The
# director and every other agent that reads motto-core-prd will pick it up
# on next restart.
#
# Trigger manually with workflow_dispatch. Safe to re-run (idempotent —
# Northflank secret group addons accept upsert via PATCH).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert DEEPSEEK_API_KEY into motto-core-prd
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY || secrets.NORTHFLANK_API }}
          DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
        run: |
          set -euo pipefail
          if [ -z "$NORTHFLANK_API_KEY" ]; then
            echo "::error::NORTHFLANK_API_KEY (or NORTHFLANK_API) repo secret is not set"
            exit 1
          fi
          if [ -z "$DEEPSEEK_API" ]; then
            echo "::error::DEEPSEEK_API repo secret is not set"
            exit 1
          fi

          # Northflank secret-group addon endpoint:
          # PATCH /v1/projects/{project}/secrets/{group} body { secrets: { variables: { KEY: value } } }
          # PATCH on secret groups MERGES (unlike on jobs which REPLACES).
          # https://northflank.com/docs/v1/api/secrets/update-a-secret-group
          PROJECT_ID=motto-agents
          GROUP_ID=motto-core-prd

          payload=$(jq -n --arg v "$DEEPSEEK_API" '{secrets:{variables:{DEEPSEEK_API_KEY:$v}}}')

          echo "Upserting DEEPSEEK_API_KEY into $PROJECT_ID/$GROUP_ID..."
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID" \
            | jq '.data | {id, name, updatedAt}'

          # Verify the key is present (without echoing the value).
          present=$(curl -fsS \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID" \
            | jq -r '.data.secrets.variables | has("DEEPSEEK_API_KEY")')
          if [ "$present" != "true" ]; then
            echo "::error::DEEPSEEK_API_KEY not present in $GROUP_ID after upsert"
            exit 1
          fi
          echo "::notice::DEEPSEEK_API_KEY upserted into $GROUP_ID. Restart agents to pick up."
