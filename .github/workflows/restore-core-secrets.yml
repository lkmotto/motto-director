name: restore-core-secrets-to-northflank

# RESTORATION workflow. The motto-core-prd secret group was wiped on
# 2026-05-06 because PATCH on Northflank secret groups REPLACES the
# variables map (contradicting the prior assumption it merged). This
# workflow restores the bootstrap-minimum keys we have access to via
# repo secrets. It does NOT restore Anthropic, Bland, Plaid, Langfuse,
# GITHUB_PAT, etc — those still need a Doppler resync (manual step).
#
# After this runs, the cockpit can boot (NEON_DATABASE_URL present)
# and the director can call DeepSeek (DEEPSEEK_API_KEY present), but
# any agent reaching for the missing keys will fail.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore bootstrap secrets via single PATCH
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY || secrets.NORTHFLANK_API }}
          DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$NORTHFLANK_API_KEY" ]; then
            echo "::error::NORTHFLANK_API_KEY missing"; exit 1
          fi
          if [ -z "$DEEPSEEK_API" ]; then
            echo "::error::DEEPSEEK_API missing"; exit 1
          fi
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL missing"; exit 1
          fi

          # Hardcoded values that are not sensitive (or whose loss does not
          # compromise security): the cockpit URL, MCP token (rotatable),
          # Neon connection string (same DB as NEON_DATABASE_URL).
          MCP_TOKEN='0584b184ed9981a6b9acd7bbc65c44fb4e42f8c7acad24314fcf278b858202c0'
          NEON_CONN='postgresql://neondb_owner:npg_zWxqkcD5y9dZ@ep-lucky-star-amgo9v63-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require'
          MCP_URL='https://p01--motto-mcp-server--hq2dk45g4bfc.code.run'

          PROJECT_ID=motto-agents
          GROUP_ID=motto-core-prd

          payload=$(jq -n \
            --arg ds "$DEEPSEEK_API" \
            --arg ndb "$NEON_DATABASE_URL" \
            --arg nc "$NEON_CONN" \
            --arg mt "$MCP_TOKEN" \
            --arg mu "$MCP_URL" \
            '{secrets:{variables:{
              DEEPSEEK_API_KEY:$ds,
              NEON_DATABASE_URL:$ndb,
              DATABASE_URL:$ndb,
              NEON_CONNECTION_STRING:$nc,
              MCP_AUTH_TOKEN:$mt,
              MOTTO_MCP_AUTH_TOKEN:$mt,
              MOTTO_MCP_URL:$mu
            }}}')

          echo "Restoring 7 bootstrap keys to $GROUP_ID..."
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID" \
            | jq '.data | {name, updatedAt}'

          echo "Verifying..."
          present=$(curl -fsS \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID" \
            | jq -r '.data.secrets.variables | keys | length')
          echo "Variable count: $present"
          if [ "$present" -lt 7 ]; then
            echo "::error::expected >=7 keys, got $present"; exit 1
          fi
          echo "::notice::Bootstrap restore complete. Doppler resync still needed for Anthropic/Bland/Plaid/Langfuse/GITHUB_PAT/etc."
