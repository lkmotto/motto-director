name: prune-stale-llm-secrets-from-northflank

# One-shot workflow to remove deprecated LLM provider secrets from the
# Northflank motto-core-prd secret group. After the DeepSeek-only migration
# (motto-director #36, motto-mcp-server #25), these keys are no longer
# referenced anywhere in the fleet:
#   - ANTHROPIC_API_KEY
#   - ANTHROPIC_AUTH_TOKEN
#   - CLAUDE_CODE_OAUTH_TOKEN
#   - GROQ_API_KEY
#   - OPENROUTER_API_KEY
#
# Northflank PATCH on secret groups MERGES (per empirical verification),
# so to delete keys we GET the current variables, drop the stale ones,
# then POST the full set back (POST replaces, per Northflank API docs:
# https://northflank.com/docs/v1/api/project/secrets/update-project-secret).
#
# Trigger manually with workflow_dispatch. Idempotent — re-running is a no-op.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale LLM secrets from motto-core-prd
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY || secrets.NORTHFLANK_API }}
        run: |
          set -euo pipefail
          if [ -z "$NORTHFLANK_API_KEY" ]; then
            echo "::error::NORTHFLANK_API_KEY (or NORTHFLANK_API) repo secret is not set"
            exit 1
          fi

          PROJECT_ID=motto-agents
          GROUP_ID=motto-core-prd

          STALE_KEYS=(
            ANTHROPIC_API_KEY
            ANTHROPIC_AUTH_TOKEN
            CLAUDE_CODE_OAUTH_TOKEN
            GROQ_API_KEY
            OPENROUTER_API_KEY
          )

          echo "Fetching current variables..."
          current=$(curl -fsS \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID")

          # Build a jq filter that deletes each stale key.
          filter='.data.secrets.variables'
          for k in "${STALE_KEYS[@]}"; do
            filter="$filter | del(.\"$k\")"
          done

          new_vars=$(echo "$current" | jq "$filter")

          # Report which keys were actually present before deletion (no values).
          echo "Stale keys present before prune:"
          for k in "${STALE_KEYS[@]}"; do
            if echo "$current" | jq -e ".data.secrets.variables | has(\"$k\")" > /dev/null; then
              echo "  - $k (will remove)"
            else
              echo "  - $k (already absent)"
            fi
          done

          # POST replaces the secret's variables with the full pruned set.
          payload=$(jq -n --argjson v "$new_vars" '{secrets:{variables:$v}}')

          echo "Replacing variables with pruned set (POST replaces)..."
          curl -fsS -X POST \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID" \
            | jq '.data | {id, name, updatedAt}'

          echo "Verifying stale keys are gone..."
          after=$(curl -fsS \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID")
          fail=0
          for k in "${STALE_KEYS[@]}"; do
            if echo "$after" | jq -e ".data.secrets.variables | has(\"$k\")" > /dev/null; then
              echo "::error::$k still present after prune"
              fail=1
            else
              echo "  - $k removed"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "::notice::Stale LLM secrets pruned from $GROUP_ID."
