name: sync-neon-secret-to-northflank

# One-shot workflow to push secrets.NEON_DATABASE_URL into the Northflank
# motto-core-prd secret group as NEON_DATABASE_URL. The motto-mcp-server
# cockpit reads NEON_DATABASE_URL (or DATABASE_URL) on startup; without
# this, the new DeepSeek-migrated cockpit container crash-loops.
#
# Trigger manually with workflow_dispatch. Safe to re-run (idempotent —
# Northflank secret group PATCH merges).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert NEON_DATABASE_URL into motto-core-prd
        env:
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY || secrets.NORTHFLANK_API }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$NORTHFLANK_API_KEY" ]; then
            echo "::error::NORTHFLANK_API_KEY (or NORTHFLANK_API) repo secret is not set"
            exit 1
          fi
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL repo secret is not set"
            exit 1
          fi

          PROJECT_ID=motto-agents
          GROUP_ID=motto-core-prd

          payload=$(jq -n --arg v "$NEON_DATABASE_URL" '{secrets:{variables:{NEON_DATABASE_URL:$v}}}')

          echo "Upserting NEON_DATABASE_URL into $PROJECT_ID/$GROUP_ID..."
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID" \
            | jq '.data | {id, name, updatedAt}'

          present=$(curl -fsS \
            -H "Authorization: Bearer $NORTHFLANK_API_KEY" \
            "https://api.northflank.com/v1/projects/$PROJECT_ID/secrets/$GROUP_ID" \
            | jq -r '.data.secrets.variables | has("NEON_DATABASE_URL")')
          if [ "$present" != "true" ]; then
            echo "::error::NEON_DATABASE_URL not present in $GROUP_ID after upsert"
            exit 1
          fi
          echo "::notice::NEON_DATABASE_URL upserted into $GROUP_ID. Restart cockpit to pick up."
