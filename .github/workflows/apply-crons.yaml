name: apply-crons

# Pushes northflank/crons.yaml changes to Northflank as cron jobs
# whenever the manifest lands on main. Idempotent — see
# scripts/apply_northflank_crons.py for behavior.

on:
  push:
    branches: [main]
    paths:
      - 'northflank/crons.yaml'
      - 'scripts/apply_northflank_crons.py'
      - '.github/workflows/apply-crons.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print intended writes without calling the Northflank API'
        type: boolean
        default: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml

      - name: Apply crons
        env:
          # Accept either canonical name; old runs used NORTHFLANK_API,
          # new convention is NORTHFLANK_API_KEY.
          NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY || secrets.NORTHFLANK_API }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/apply_northflank_crons.py
