name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ matrix.python-version }}-
      - name: Install uv
        run: pip install uv
      - name: Install project
        run: uv pip install --system ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Verify DEFAULT_WATCH_REPOS slugs
        env:
          WATCH_REPOS_VERIFY_TOKEN: ${{ secrets.WATCH_REPOS_VERIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_watch_repos.py
      - name: Auto-merge guard self-test
        run: bash .github/workflows/auto-merge-guard-test.sh

      # Posts the last 250 log lines of any failed step in this run as a sticky
      # PR comment so Claude sessions (which can't reach Actions logs from inside
      # the harness) can debug failures via mcp__github__pull_request_read
      # method=get_comments. Single comment per PR, upserts on re-run.
      - name: Post CI failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: jobsResp } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failedJobs = jobsResp.jobs.filter(j =>
              j.conclusion === 'failure' ||
              (j.steps || []).some(s => s.conclusion === 'failure')
            );
            if (failedJobs.length === 0) return;

            const sha = context.sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- ci-failure-comment -->';
            let body = `${marker}\n## ❌ CI failure on ${sha}\n\n[Full run](${runUrl})\n\n`;

            for (const job of failedJobs) {
              const failedStep = (job.steps || []).find(s => s.conclusion === 'failure');
              body += `### \`${job.name}\` — failed step: \`${failedStep ? failedStep.name : 'unknown'}\`\n\n`;
              try {
                const res = await github.request(
                  'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                  { owner: context.repo.owner, repo: context.repo.repo, job_id: job.id }
                );
                const text = typeof res.data === 'string'
                  ? res.data
                  : Buffer.from(res.data).toString('utf-8');
                const tail = text.split('\n').slice(-250).join('\n');
                body += `<details><summary>Last 250 log lines</summary>\n\n~~~\n${tail}\n~~~\n</details>\n\n`;
              } catch (e) {
                body += `_could not fetch log: ${e.message}_\n\n`;
              }
            }

            const prNumber = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
